<!doctype html>
<html lang="en" data-ui2-theme="slate">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>__title__</title>
  <link rel="stylesheet" href="css/ui2.css?v=__datetimeinseconds__">
  <link rel="stylesheet" href="react/ui2-react.css?v=__datetimeinseconds__">
</head>
<body>
  <div class="ui2-shell" data-app-title="__title__" data-app-id="__application__">
    <header class="ui2-topbar">
      <div class="ui2-titlebar">
        <button class="ui2-nav-icon-button" id="ui2-nav-toggle" type="button" aria-controls="ui2-sidebar" aria-expanded="true" aria-label="Hide menu" title="Hide menu">
          <span></span>
          <span></span>
          <span></span>
        </button>
        <a class="ui2-title-link" href="?apprun=1" title="Open another __title__ instance">
          <p class="ui2-kicker">GenApp ui2</p>
          <h1>__title__</h1>
        </a>
      </div>
      <div class="ui2-project-control" id="ui2-project-control">
        <button class="ui2-project-chip" id="ui2-session-status" type="button" aria-haspopup="dialog">Select project</button>
      </div>
      <div class="ui2-topbar-utilities" aria-label="Application utilities">
        <button class="ui2-utility-button" id="ui2-jobs" type="button">Jobs</button>
        <button class="ui2-utility-button" id="ui2-files" type="button">Files</button>
        <div class="ui2-menu-control" id="ui2-help-control">
          <button class="ui2-utility-button" id="ui2-help-menu-toggle" type="button" aria-haspopup="true" aria-expanded="false">Help</button>
          <div class="ui2-account-menu" id="ui2-help-menu" role="menu" hidden>
            <a id="ui2-docs" role="menuitem" href="../docs/" target="_blank" rel="noopener">Documentation</a>
            <a id="ui2-docs-module" role="menuitem" href="../docs/" target="_blank" rel="noopener" hidden>Current module documentation</a>
            <button id="ui2-ai-helper" role="menuitem" type="button" hidden>AI Helper</button>
          </div>
        </div>
        <div class="ui2-menu-control" id="ui2-account-control">
          <button class="ui2-account-button" id="ui2-account-menu-toggle" type="button" aria-haspopup="true" aria-expanded="false">
            <img id="ui2-account-avatar" alt="" hidden>
            <span class="ui2-account-initials" id="ui2-account-initials" aria-hidden="true">?</span>
            <span class="ui2-account-name" id="ui2-account-name">Account</span>
          </button>
          <div class="ui2-account-menu" id="ui2-account-menu" role="menu" hidden>
            <p class="ui2-account-identity" id="ui2-account-identity">Not logged on</p>
            <button id="ui2-settings" role="menuitem" type="button">Settings</button>
            <button id="ui2-feedback" role="menuitem" type="button">Feedback</button>
            <button id="ui2-help" role="menuitem" type="button" aria-pressed="false">Hover help off</button>
            <button id="ui2-logoff" role="menuitem" type="button">Login</button>
          </div>
        </div>
      </div>
    </header>

    <main class="ui2-workspace">
      <aside class="ui2-sidebar" id="ui2-sidebar" aria-label="Modules">
        <nav class="ui2-menu-nav" id="ui2-menu-nav" aria-label="Application modules"></nav>
      </aside>

      <div class="ui2-content-column">
        <nav class="ui2-module-strip" id="ui2-module-strip" aria-label="Selected menu modules" hidden></nav>
        <section class="ui2-stage" aria-live="polite">
          <div class="ui2-empty" id="ui2-empty">
            <h2>Choose a menu group from the options on the left.</h2>
            <p>Then choose a module from the list that appears above this workspace.</p>
          </div>
          <div id="ui2-module-root" hidden></div>
        </section>
      </div>
    </main>
    <footer class="ui2-footer">
      <span>Current funding provided by NSF grants (CHE-1265821, OAC-1912444 &amp; OAC-1739549) and NIST</span>
      <span class="ui2-ws-indicator ui2-ws-indicator-pending" title="WebSocket status pending">
        <span>WS</span>
        <span class="ui2-ws-dot" aria-hidden="true"></span>
      </span>
    </footer>
  </div>
  <script src="js/app-map.js?v=__datetimeinseconds__"></script>
  <script src="../js/autobahn.min.js?v=__datetimeinseconds__"></script>
  <script src="../js/plotly-2.35.2.min.js?v=__datetimeinseconds__"></script>
  <script src="js/plot-presentations.js?v=__datetimeinseconds__"></script>
  <script src="js/ui2.js?v=__datetimeinseconds__"></script>
  <script type="module" src="react/ui2-react.js?v=__datetimeinseconds__"></script>
</body>
</html>
