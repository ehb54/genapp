<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>__title__</title>
  <link rel="stylesheet" href="css/ui2.css?v=__datetimeinseconds__">
</head>
<body>
  <div class="ui2-shell" data-app-title="__title__">
    <header class="ui2-topbar">
      <div>
        <p class="ui2-kicker">GenApp ui2</p>
        <h1>__title__</h1>
      </div>
      <div class="ui2-actions" aria-label="Layout actions">
        <button class="ui2-button ui2-button-quiet" id="ui2-nav-toggle" type="button" aria-controls="ui2-sidebar" aria-expanded="true">Hide Menu</button>
      </div>
    </header>

    <main class="ui2-workspace">
      <aside class="ui2-sidebar" id="ui2-sidebar" aria-label="Modules">
        <nav class="ui2-menu-nav" id="ui2-menu-nav" aria-label="Application modules"></nav>
      </aside>

      <section class="ui2-stage" aria-live="polite">
        <div class="ui2-empty" id="ui2-empty">
          <p class="ui2-kicker">Ready</p>
          <h2>Choose a module to inspect.</h2>
          <p>This first ui2 pass renders GenApp module JSON with modern controls without changing the legacy html5 target.</p>
        </div>
        <div id="ui2-module-root" hidden></div>
      </section>
    </main>
  </div>
  <script src="js/app-map.js?v=__datetimeinseconds__"></script>
  <script src="js/ui2.js?v=__datetimeinseconds__"></script>
</body>
</html>
