<!doctype html><meta charset="utf-8">
<script src="../../languages/html5/add/js/plotly-2.35.2.min.js"></script>
<script src="../../languages/ui2/add/js/plotly-layout.js"></script>
<div id="plot" style="width:856px;height:558px"></div><pre id="results">pending</pre>
<script>
(async () => {
 const plot=document.getElementById('plot'), api=GenAppPlotlyLayout;
 const copy=x=>JSON.parse(JSON.stringify(x));
 const result={version:Plotly.version,checks:[]};
 const check=(ok,label)=>{if(!ok)throw Error(label);result.checks.push(label);};
 const pause=ms=>new Promise(resolve=>setTimeout(resolve,ms));
 const collisions=()=>{const rows=api.tickLabelRows(plot);return rows.length-api.nonOverlappingTicks(rows).length;};
 // Wait for the actual event handler, never call the fitter after an interaction.
 const settled=async()=>{await pause(100);check(collisions()===0,'event-driven fit '+result.checks.length);};
 const values=[.009,.01,.02,.08,.1,.3];
 const cases=[
  ['log', {x:values,y:values}, {xaxis:{type:'log'},yaxis:{type:'log'}}],
  ['linear', {x:[-2,-1,0,1,2,3],y:[-2,-1,0,1,2,3]}, {xaxis:{type:'linear'},yaxis:{type:'linear'}}],
  ['inferred', {x:values,y:values}, {}],
  ['date', {x:['2020-01-01','2020-01-02','2020-01-03'],y:['2020-01-01','2020-01-02','2020-01-03']}, {xaxis:{type:'date'},yaxis:{type:'date'}}],
  ['category', {x:['A long category','Another long category','Third category'],y:['First long category','Second long category','Third long category']}, {xaxis:{type:'category'},yaxis:{type:'category'}}],
  ['custom', {x:[0,1,2],y:[0,1,2]}, {xaxis:{tickmode:'array',tickvals:[0,1,2],ticktext:['very long first label','very long second label','very long third label']},yaxis:{tickmode:'array',tickvals:[0,1,2],ticktext:['line one<br>line two<br>line three','line one<br>line two<br>line three','line one<br>line two<br>line three']}}],
  ['blank-custom', {x:[0,1,2,3],y:[0,1,2,3]}, {xaxis:{tickmode:'array',tickvals:[0,1,2,3],ticktext:['very long first label','','very long third label','very long last label'],tickprefix:'$',ticksuffix:' units'}}],
  ['template', {x:values,y:values}, {template:{layout:{xaxis:{type:'log',tickmode:'auto'},yaxis:{type:'log'}}}}],
  ['reversed', {x:values,y:values}, {xaxis:{type:'log',autorange:'reversed'},yaxis:{type:'log',autorange:'reversed'}}]
 ];
 let reproduced=false;
 for(const [name,trace,axes] of cases) {
  const source={data:[{type:'scatter',mode:'markers',...trace}],layout:{...axes,margin:{l:100,r:50,t:30,b:90},font:{size:16}}};
  const saved=JSON.stringify(source);
  for(const [width,height] of [[856,558],[340,260],[1200,700],[480,320]]) {
   Plotly.purge(plot);plot.style.width=width+'px';plot.style.height=height+'px';
   await Plotly.newPlot(plot,copy(source.data),copy(source.layout));
   const originalLabels=api.tickLabelRows(plot).map(row=>row.name+':'+row.text);
   const grids=()=>Array.from(plot.querySelectorAll('.gridlayer path')).map(n=>n.getAttribute('class')+' '+n.getAttribute('transform')+' '+n.getAttribute('d')).sort();
   const originalGrids=JSON.stringify(grids());
   const ranges=JSON.stringify([plot._fullLayout.xaxis.range,plot._fullLayout.yaxis.range]);
   reproduced=reproduced||collisions()>0;
   await api.applyTickDensity(plot);
   check(collisions()===0,name+' both axes '+width+'x'+height);
   check(JSON.stringify(grids())===originalGrids,name+' grid positions preserved');
   check(api.tickLabelRows(plot).every(row=>originalLabels.includes(row.name+':'+row.text)),name+' retained text unchanged');
   check(JSON.stringify([plot._fullLayout.xaxis.range,plot._fullLayout.yaxis.range])===ranges,name+' ranges preserved');
   await api.applyTickDensity(plot);
   check(collisions()===0,name+' repeat fit');
   await Plotly.relayout(plot,{'xaxis.autorange':true,'yaxis.autorange':true});await settled();
   plot.style.width=(width+83)+'px';await Plotly.Plots.resize(plot);await settled();
   check(JSON.stringify(source)===saved,name+' saved source unchanged');
  }
 }
 check(reproduced,'neutral collision reproduced');
 await Plotly.newPlot(plot,[{x:values,y:values}],{xaxis:{type:'log'},yaxis:{type:'log'}});
 await api.applyTickDensity(plot);
 for(const range of [[-2,-1.05],[-1.3,-.9],[-3,.5],[-1,-2]]) {
  await Plotly.relayout(plot,{'xaxis.range':range,'yaxis.range':range});await settled();
  check(JSON.stringify(plot._fullLayout.xaxis.range)===JSON.stringify(range),'zoom range retained');
 }
 const first=Plotly.relayout(plot,{'xaxis.range':[-2,-1]});
 const second=Plotly.relayout(plot,{'xaxis.range':[-1.8,-.8]});
 await Promise.all([first,second]);await settled();
 check(JSON.stringify(plot._fullLayout.xaxis.range)===JSON.stringify([-1.8,-.8]),'latest rapid zoom retained');
 const panels={grid:{rows:2,columns:1,subplots:[['xy'],['x2y2']]},xaxis:{type:'log'},yaxis:{type:'log'},xaxis2:{type:'log'},yaxis2:{type:'log'}};
 await Plotly.newPlot(plot,[{x:values,y:values},{x:values,y:values,xaxis:'x2',yaxis:'y2'}],panels);
 await api.applyTickDensity(plot);check(collisions()===0,'numbered subplot axes');
 await Plotly.newPlot(plot,[{x:values,y:values},{x:values,y:values,yaxis:'y2'}],{xaxis:{type:'log'},yaxis:{type:'log'},yaxis2:{type:'log',overlaying:'y',side:'right'}});
 await api.applyTickDensity(plot);check(collisions()===0,'overlaid axes');
 await Plotly.react(plot,[{x:values,y:values}],{xaxis:{type:'log'},yaxis:{type:'log'}});await settled();
 await api.settleTickDensity(plot);
 const displayed=copy(plot.layout), data=copy(plot.data);
 const png=await Plotly.toImage(plot,{format:'png',scale:2,width:plot._fullLayout.width,height:plot._fullLayout.height});
 const image=new Image();image.src=png;await image.decode();
 check(image.naturalWidth===plot._fullLayout.width*2,'PNG uses displayed dimensions');
 window.tickDensityPNG=png;
 Plotly.purge(plot);await Plotly.newPlot(plot,data,displayed);
 check(collisions()===0,'displayed layout reconstruction for export/editor');
 await api.applyTickDensity(plot);check(collisions()===0,'fresh plot reconstruction');
 result.passed=true;window.tickDensityAcceptance=result;
 document.getElementById('results').textContent=JSON.stringify(result);
})().catch(error=>{window.tickDensityAcceptance={error:error.stack};document.getElementById('results').textContent=JSON.stringify(window.tickDensityAcceptance);});
</script>
