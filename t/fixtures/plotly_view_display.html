<!doctype html>
<meta charset="utf-8"><title>Neutral view-selected display contract</title>
<script src="../../languages/html5/add/js/plotly-2.35.2.min.js"></script>
<script src="../../languages/ui2/add/js/plotly-layout.js"></script>
<div id="plot" style="width:640px;height:480px"></div><pre id="results">Running</pre>
<script>
(async()=>{
 const checks=[],check=(v,label)=>{if(!v)throw Error(label);checks.push(label);};
 const clone=v=>JSON.parse(JSON.stringify(v)),same=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
 const plot=document.getElementById('plot'),p=GenAppPlotlyLayout;
 const source={data:[],layout:{autosize:true,margin:{l:70,r:40,t:60,b:100},showlegend:false}};
 for(let i=0;i<4;i++){
  const suffix=i?String(i+1):'',x='x'+suffix,y='y'+suffix,upper=i<2,left=i%2===0;
  source.layout['xaxis'+suffix]={domain:left?[0,.44]:[.56,1],anchor:y,title:'Observation',range:[0,110]};
  source.layout['yaxis'+suffix]={domain:upper?[.57,1]:[0,.36],anchor:x,title:'Response '+i,range:[0,10]};
  source.data.push({type:'scatter',mode:'lines+markers',x:[0,50,99,100],y:[1,4,7,8],xaxis:x,yaxis:y,meta:{series_role:'series_'+i},hovertemplate:'observation %{x:.0f}<br>sample response %{y:.3f}<extra>group</extra>'});
 }
 source.layout.yaxis5={overlaying:'y3',anchor:'x3',side:'right',range:[0,10],title:'Secondary response'};
 source.data.push({...clone(source.data[2]),yaxis:'y5',meta:{series_role:'secondary'}});
 const saved=JSON.stringify(source),selection={displayLayout:{height:960,xAxisDomains:{xaxis:[0,.4],xaxis2:[.6,1],xaxis3:[0,.32],xaxis4:[.68,1]}},hoverTemplateLineBreaks:{secondary:'observation %{x:.0f}<br>sample response<br>%{y:.3f}<extra>group</extra>'}};
 await Plotly.newPlot(plot,clone(source.data),clone(source.layout),{responsive:true});
 check(plot._fullLayout.height===480,'ordinary host height preserved');
 check(same(plot.layout.xaxis3.domain,[0,.44]),'ordinary domains preserved');
 check(JSON.stringify(source)===saved,'ordinary source untouched');
 const missing=['prepareViewDisplay','applyViewDisplayHeight'].filter(k=>typeof p[k]!=='function');
 if(missing.length){window.viewDisplayAcceptance={passed:false,expectedMissing:missing,checks};document.getElementById('results').textContent=JSON.stringify(window.viewDisplayAcceptance);return;}
 check(p.prepareViewDisplay(source,{})===source,'absent selection is a no-op');
 const display=p.prepareViewDisplay(source,selection);
 check(same(display.layout.xaxis3.domain,[0,.32]),'selected domains prepared');
 check(display.data[4].hovertemplate===selection.hoverTemplateLineBreaks.secondary,'only selected line breaks prepared');
 check(display.data[3].hovertemplate===source.data[3].hovertemplate,'other role unchanged');
 check(same(display.data.map(t=>[t.x,t.y,t.meta]),source.data.map(t=>[t.x,t.y,t.meta])),'values and identity preserved');
 check(same(display.layout.yaxis5,source.layout.yaxis5),'secondary relationship and range preserved');
 check(JSON.stringify(source)===saved,'selected source untouched');
 for(const bad of [null,true,[],{height:'960'},{height:-1},{height:Infinity},{xAxisDomains:{xaxis:[.8,.2]}},{xAxisDomains:{xaxis:[0,2]}},{xAxisDomains:{xaxis9:[0,.5]}},{xAxisDomains:{yaxis:[0,.5]}}]){
  const value=p.prepareViewDisplay(source,{displayLayout:bad});check(same(value,source),'invalid layout ignored '+JSON.stringify(bad));
 }
 for(const template of ['changed %{x:.0f}<br>sample response %{y:.3f}<extra>group</extra>','observation %{x:.0f}<br>sample response %{y:.2f}<extra>group</extra>','observation %{x:.0f}<br>sample response %{y:.3f}<extra>changed</extra>']){
  check(same(p.prepareViewDisplay(source,{hoverTemplateLineBreaks:{secondary:template}}),source),'semantic or precision replacement rejected');
 }
 check(same(p.prepareViewDisplay(source,{hoverTemplateLineBreaks:{unknown:selection.hoverTemplateLineBreaks.secondary}}),source),'unmatched role unchanged');
 p.applyViewDisplayHeight(plot,selection);check(plot.style.height==='960px','height selected');
 p.applyViewDisplayHeight(plot,selection);check(plot.style.height==='960px','height idempotent');
 await Plotly.react(plot,clone(display.data),clone(display.layout),{responsive:true});
 await Plotly.Plots.resize(plot);
 check(plot._fullLayout.height===960,'selected host used by Plotly');
 check(plot.getBoundingClientRect().width===640,'width unchanged');
 p.applyViewDisplayHeight(plot,{});check(plot.style.height==='480px','selection removal restores original height');
 p.applyViewDisplayHeight(plot,selection);plot.style.height='700px';p.applyViewDisplayHeight(plot,{});check(plot.style.height==='700px','newer external height preserved');
 plot.style.height='480px';p.applyViewDisplayHeight(plot,selection);
 plot.style.width='505px';await Plotly.Plots.resize(plot);check(plot._fullLayout.height===960&&Math.abs(plot._fullLayout.width-505)<1,'existing resize honors host only');
 const original=await (await fetch('../../languages/ui2/add/js/ui2.js')).text();
 const resolver=original.slice(original.indexOf('  function plotPresentationForOutput('),original.indexOf('  function plotPresentationProfileForOutput('));
 const resolve=new Function('state','reactWorkbenchRoot','cloneUi2Value',resolver+';return plotGeometryForOutput;');
 const state={view:{results:{groups:[{outputs:['neutral'],plotPresentation:selection}]}}};
 const output={isConnected:true,dataset:{outputFieldId:'neutral'},closest:()=>null};
 check(same(resolve(state,null,clone)(output),selection),'native resolves same bounded display selection');
 check(same(resolve({view:{results:{groups:[]}}},null,clone)(output),{}),'non-selected native output unchanged');
 check(JSON.stringify(source)===saved,'all lifecycle checks preserve source');
 window.viewDisplayAcceptance={passed:true,checks};document.getElementById('results').textContent=JSON.stringify(window.viewDisplayAcceptance);
})().catch(error=>{window.viewDisplayAcceptance={passed:false,error:error.stack};document.getElementById('results').textContent=JSON.stringify(window.viewDisplayAcceptance);});
</script>
